[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "kael-tensor"
version = "1.0.0"
description = "A deep learning framework written from scratch in C++"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis",
    "torch",
    "transformers",
    "safetensors",
    "tiktoken",
    "fastapi",
    "httpx",
]

[tool.scikit-build]
wheel.packages = ["python/kael"]
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
KAEL_BUILD_PYTHON = "ON"
KAEL_BUILD_TESTS = "OFF"

[tool.ruff]
src = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* pp*"
archs = ["native"]
test-requires = ["pytest", "hypothesis", "fastapi", "httpx"]
test-command = "pytest {project}/python/tests -q"

# NumPy no longer ships manylinux2014 wheels, so tests in that image would build it from source.
[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
