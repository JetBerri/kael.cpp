[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "kael-tensor"
version = "0.4.0"
description = "A deep learning framework written from scratch in C++"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "torch"]

[tool.scikit-build]
wheel.packages = ["python/kael"]
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
KAEL_BUILD_PYTHON = "ON"
KAEL_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
