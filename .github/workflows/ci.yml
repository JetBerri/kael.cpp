name: CI
on: [push, pull_request]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            sanitizers: OFF
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: OFF
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
            sanitizers: OFF
          - name: linux-clang-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: ON
          - name: linux-clang-tsan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: OFF
            tsan: ON
          - name: linux-clang-fake-cuda
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: ON
            fake_cuda: ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DKAEL_WARNINGS_AS_ERRORS=ON
          -DKAEL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DKAEL_ENABLE_TSAN=${{ matrix.tsan || 'OFF' }}
          -DKAEL_FAKE_CUDA=${{ matrix.fake_cuda || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda-build:
    name: cuda-compile-only
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: apt-get update && apt-get install -y python3-pip && pip3 install cmake
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DKAEL_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86
      - name: Build
        run: cmake --build build --parallel

  python:
    name: python-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[test]"
      - name: Test
        run: pytest python/tests -q

  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DKAEL_BUILD_FUZZERS=ON -DKAEL_BUILD_TESTS=OFF -DKAEL_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run
        run: |
          for target in fuzz_safetensors fuzz_idx; do
            build/fuzz/$target -max_total_time=60 -malloc_limit_mb=2048 fuzz/corpus/$target
          done

  coverage:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKAEL_FAKE_CUDA=ON
          -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: LLVM_PROFILE_FILE=kael.profraw build/tests/kael_tests
      - name: Report
        run: |
          version=$(clang -dumpversion | cut -d. -f1)
          llvm-profdata-$version merge -sparse kael.profraw -o kael.profdata
          llvm-cov-$version report build/tests/kael_tests -instr-profile=kael.profdata src include/kael

  clang-tidy:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DKAEL_FAKE_CUDA=ON -DKAEL_BUILD_TESTS=OFF
      - name: Run
        run: run-clang-tidy -p build -quiet "src/.*\\.cpp$"
