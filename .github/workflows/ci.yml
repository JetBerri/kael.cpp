name: CI
on: [push, pull_request]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            sanitizers: OFF
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: OFF
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
            sanitizers: OFF
          - name: linux-clang-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            sanitizers: ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DKAEL_WARNINGS_AS_ERRORS=ON
          -DKAEL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
